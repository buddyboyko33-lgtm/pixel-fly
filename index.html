const TR={tab:'offer',pick:null,d:{gp:0,gg:0,gi:[],wp:0,wg:0,wi:[]},rd:null,out:'',msg:''},ND=()=>({gp:0,gg:0,gi:[],wp:0,wg:0,wi:[]});
const ck=j=>[...j].reduce((a,c)=>(a*31+c.charCodeAt(0))%99991,7),enc=(pre,o)=>{const j=JSON.stringify(o);return pre+btoa(j)+'.'+ck(j)};
const dec=(pre,t)=>{try{t=t.trim();if(!t.startsWith(pre))return;const[b,k]=t.slice(pre.length).split('.'),j=atob(b);if(ck(j)!=k)return;return JSON.parse(j)}catch(e){}};
const isStart=d=>['skin','bg','pipe'].includes(M[d].cat)&&d==first(M[d].cat);
const okSide=(p,g,it)=>Number.isInteger(p)&&Number.isInteger(g)&&p>=0&&g>=0&&p<=1e7&&g<=1e5&&Array.isArray(it)&&it.length<=6&&new Set(it).size==it.length&&it.every(d=>M[d]&&!isStart(d));
const okOffer=o=>o&&typeof o.id=='string'&&o.id.length<20&&okSide(o.gp,o.gg,o.gi)&&okSide(o.wp,o.wg,o.wi)&&(o.gp+o.gg+o.gi.length)>0&&(o.wp+o.wg+o.wi.length)>0;
const sideT=(p,g,it)=>[p?p+'●':'',g?g+'◆':'',...it.map(d=>M[d].name)].filter(Boolean).join(', ')||'nothing';
const tGive=x=>{S.inv[x]=(S.inv[x]||0)+1},tTake=x=>{S.inv[x]--;if(!S.inv[x])Object.keys(S.eq).forEach(k=>{if(S.eq[k]==x)S.eq[k]=['skin','bg','pipe'].includes(k)?first(k):null})};
const owns=(p,g,it)=>S.p>=p&&S.g>=g&&it.every(x=>S.inv[x]>0);
const ttab=t=>{TR.tab=t;TR.pick=null;TR.out='';TR.msg='';TR.rd=null;UI.trade()};
const trm=(k,x)=>{TR.d[k+'i']=TR.d[k+'i'].filter(y=>y!=x);UI.trade()};
const tpick=id=>{const a=TR.d[TR.pick+'i'];if(a.length>=6)toast('Max 6 items');else a.push(id);TR.pick=null;UI.trade()};
function copyT(){const e=$('#tout');e.select();try{navigator.clipboard.writeText(e.value).then(()=>toast('Code copied!'),()=>toast('Select the code and copy it'))}catch(x){toast('Select the code and copy it')}}
function mkOffer(){const d=TR.d,o={id:Math.random().toString(36).slice(2,10),...d};
 if(!okOffer(o))return toast('Offer something and ask for something');if(!owns(d.gp,d.gg,d.gi))return toast("You don't have all of that");
 S.p-=d.gp;S.g-=d.gg;d.gi.forEach(tTake);S.tr.open[o.id]=o;save();upd();TR.out=enc('PF1-',o);TR.d=ND();TR.msg='Offer created and your items are held safe. Send this code to the other player.';UI.trade()}
function readOffer(){const o=dec('PF1-',$('#tcode').value);TR.msg='';TR.out='';
 if(!okOffer(o))TR.msg='That is not a valid offer code.';else if(S.tr.open[o.id])TR.msg='That is your own offer.';else if(S.tr.done.includes(o.id))TR.msg='You already accepted this offer.';else TR.rd=o;UI.trade()}
function acceptOffer(){const o=TR.rd;if(!owns(o.wp,o.wg,o.wi))return toast("You can't afford this trade");
 ask(`Give ${sideT(o.wp,o.wg,o.wi)} and get ${sideT(o.gp,o.gg,o.gi)}?`,()=>{if(!owns(o.wp,o.wg,o.wi))return toast("You can't afford this trade");
  S.p+=o.gp-o.wp;S.g+=o.gg-o.wg;o.wi.forEach(tTake);o.gi.forEach(tGive);S.tr.done.push(o.id);save();upd();
  TR.rd=null;TR.out=enc('PF1R-',{id:o.id,p:o.wp,g:o.wg,i:o.wi});TR.msg='Trade done! You got your items. Send this reply code back so they get theirs.';UI.trade()})}
function finishTrade(){const r=dec('PF1R-',$('#tcode2').value),o=r&&S.tr.open[r.id];
 if(!o||r.p!=o.wp||r.g!=o.wg||JSON.stringify([...r.i].sort())!=JSON.stringify([...o.wi].sort()))return toast('Reply code does not match an open offer');
 S.p+=o.wp;S.g+=o.wg;o.wi.forEach(tGive);delete S.tr.open[o.id];save();upd();toast('Trade complete!');TR.msg='Trade complete! You received '+sideT(o.wp,o.wg,o.wi)+'.';UI.trade()}
function cancelOffer(id){const o=S.tr.open[id];if(!o)return;ask('Cancel this offer and take your items back?',()=>{S.p+=o.gp;S.g+=o.gg;o.gi.forEach(tGive);delete S.tr.open[id];save();upd();TR.out='';UI.trade()})}
UI.trade=()=>{const T=TR,d=T.d,tb=$('#tb');
 $('#tt').innerHTML=[['offer','OFFER'],['accept','ACCEPT'],['pend','PENDING']].map(([k,l])=>`<button class="b ${T.tab==k?'g':''}" onclick="ttab('${k}')">${l}</button>`).join('');

 if(T.pick){const g=T.pick=='g',src=g?I.filter(i=>S.inv[i.id]>0&&!isStart(i.id)&&!d.gi.includes(i.id)):I.filter(i=>!isStart(i.id)&&!d.wi.includes(i.id));
  tb.innerHTML=`<div class="p" style="grid-column:1/-1">${g?'Pick an item to GIVE':'Pick an item you WANT'} <button class="b r" onclick="TR.pick=null;UI.trade()">CANCEL</button></div>`+listH('trd',src,it=>card(it,g?`<small>x${S.inv[it.id]}</small>`:'',`tpick('${it.id}')`));paint(tb);return}
 const blk=(k,t)=>`<div class="p"><b>${t}</b><br>Poins <input type="text" inputmode="numeric" value="${d[k+'p']}" style="width:28%" onchange="TR.d.${k}p=Math.max(0,parseInt(this.value)||0)"> Pems <input type="text" inputmode="numeric" value="${d[k+'g']}" style="width:20%" onchange="TR.d.${k}g=Math.max(0,parseInt(this.value)||0)"><br>${d[k+'i'].map(x=>`<button class="b" onclick="trm('${k}','${x}')">${M[x].name} ✖</button>`).join('')}<br><button class="b" onclick="TR.pick='${k}';UI.trade()">+ ADD ITEM</button></div>`;
 const out=(T.out?`<div class="p"><small>${T.msg}</small><br><textarea readonly id="tout">${T.out}</textarea><br><button class="b g" onclick="copyT()">COPY CODE</button></div>`:T.msg?`<div class="p"><small>${T.msg}</small></div>`:'');
 let h='';
 if(T.tab=='offer')h=out+blk('g','YOU GIVE')+blk('w','YOU WANT')+`<button class="b g" onclick="mkOffer()">CREATE OFFER CODE</button><div class="p"><small>Your side is held until the trade is finished or cancelled. Max 6 items per side.</small></div>`;
 else if(T.tab=='accept')h=T.rd?`${out}<div class="p"><b>OFFER</b><br>They give: ${sideT(T.rd.gp,T.rd.gg,T.rd.gi)}<br>They want: ${sideT(T.rd.wp,T.rd.wg,T.rd.wi)}<br><button class="b g" onclick="acceptOffer()">ACCEPT</button><button class="b r" onclick="TR.rd=null;UI.trade()">DECLINE</button></div>`:out+`<div class="p"><b>PASTE AN OFFER CODE</b><br><textarea id="tcode" placeholder="PF1-..."></textarea><button class="b g" onclick="readOffer()">READ OFFER</button></div>`;
 else{const ids=Object.keys(S.tr.open);h=out+(ids.length?ids.map(id=>{const o=S.tr.open[id];return `<div class="p"><b>OPEN OFFER</b><br>You give: ${sideT(o.gp,o.gg,o.gi)}<br>You want: ${sideT(o.wp,o.wg,o.wi)}<br><button class="b" onclick="TR.out=enc('PF1-',S.tr.open['${id}']);TR.msg='Your offer code:';UI.trade()">SHOW CODE</button><button class="b r" onclick="cancelOffer('${id}')">CANCEL</button></div>`}).join('')+`<div class="p"><b>PASTE A REPLY CODE</b><br><textarea id="tcode2" placeholder="PF1R-..."></textarea><button class="b g" onclick="finishTrade()">FINISH TRADE</button></div>`:`<div class="p"><small>No open offers.</small></div>`)}
 tb.innerHTML=h};

const MP={on:0,host:0,pc:null,dc:null,fin:0,rfin:0,rs:0,goal:30,seed:1,r:null,done:0,kind:'mpr',msg:'',code:'',tab:'h'};
const send=o=>{try{MP.dc&&MP.dc.readyState=='open'&&MP.dc.send(JSON.stringify(o))}catch(e){}};
const rtc=()=>{const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(pc.connectionState)&&MP.on&&MP.pc==pc)mpLost()};return pc};
const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r();setTimeout(r,4000)});
function mpClose(){const pc=MP.pc,dc=MP.dc;MP.pc=MP.dc=null;MP.on=0;MP.host=0;MP.code='';MP.msg='';MP.done=0;MP.fin=0;MP.rfin=0;try{dc&&dc.close();pc&&pc.close()}catch(e){}}

async function mpAnswer(){try{await MP.pc.setRemoteDescription(JSON.parse(atob($('#mpin2').value.trim())));MP.msg='Connecting...'}catch(e){MP.msg='That reply code is not valid.'}UI.mp()}
const mpCopy=()=>{const e=$('#mpc');e.select();try{navigator.clipboard.writeText(e.value).then(()=>toast('Copied!'))}catch(x){}};
function mpMsg(m){if(m.t=='start'){MP.kind=mode=m.k;MP.goal=m.g;MP.seed=m.s;MP.done=0;MP.fin=0;MP.rfin=0;MP.rs=0;MP.r=sr(m.s);begin0()}
 else if(m.t=='prog'){MP.rs=m.s;hudp()}
 else if(m.t=='dead'&&!MP.done){MP.rs=0;if(MP.kind=='mpc'){toast('Partner crashed! Back to start');mpReset()}}
 else if(m.t=='fin'){MP.rfin=1;if(MP.fin&&!MP.done)mpResult(1)}
 else if(m.t=='win'&&!MP.done)mpResult(0)}
function mpReset(){if(MP.done)return;MP.fin=0;MP.rfin=0;MP.r=sr(MP.seed);reset(false);st='ready';$('#sc').textContent=0;send({t:'prog',s:0});hudp()}
function mpDie(){st='dead';sfx('h');shake=9;for(let i=0;i<14;i++)burst(bd.x,bd.y,'#fff');if(MP.kind=='mpc')send({t:'dead'});setTimeout(()=>{if(MP.on&&!MP.done&&st=='dead')mpReset()},900)}
function mpFinish(){if(MP.done)return;if(MP.kind=='mpr'){send({t:'win'});mpResult(1)}else{MP.fin=1;send({t:'fin'});st='ready';toast('Finished! Waiting for your partner...');if(MP.rfin)mpResult(1)}}
function mpResult(w){MP.done=1;st='dead';$('#ov').innerHTML=MP.kind=='mpc'?'TEAM WIN!<br><br>You both reached the finish!':w?'YOU WIN!<br><br>You reached the finish first!':'YOU LOSE<br><br>Your opponent got there first.';show('over')}
function begin(){if(MP.on){if(MP.host){const sd=Math.random()*1e9|0,m={t:'start',k:MP.kind,g:MP.goal,s:sd};send(m);mpMsg(m)}else toast('Only the host can start a race');return}begin0()}
UI.mp=()=>{let h=`<div class="p"><small>${MP.msg||'Play with a friend on another device. No server needed: you swap two codes by chat.'}</small></div>`;
 if(MP.on)h+=MP.host?`<div class="p"><b>MODE</b><br><button class="b ${MP.kind=='mpr'?'g':''}" onclick="MP.kind='mpr';UI.mp()">RACE</button><button class="b ${MP.kind=='mpc'?'g':''}" onclick="MP.kind='mpc';UI.mp()">TEAM RACE</button><br><small>${MP.kind=='mpr'?'First to the finish line wins. If you crash you restart.':'Work together: if either of you crashes you BOTH restart. Both must reach the finish.'}</small><br>PIPES TO FINISH: ${[20,30,50].map(n=>`<button class="b ${MP.goal==n?'g':''}" onclick="MP.goal=${n};UI.mp()">${n}</button>`).join('')}<br><button class="b g" onclick="begin()">START</button></div>`:`<div class="p">Waiting for the host to start...</div>`;
 else{h+=`<div class="tabs"><button class="b ${MP.tab=='h'?'g':''}" onclick="mpClose();MP.tab='h';UI.mp()">HOST</button><button class="b ${MP.tab=='j'?'g':''}" onclick="mpClose();MP.tab='j';UI.mp()">JOIN</button></div>`;
  const ta=`<textarea readonly id="mpc" onclick="this.select()">${MP.code}</textarea><button class="b" onclick="mpCopy()">COPY</button>`;
  h+=MP.tab=='h'?(MP.code?`<div class="p"><b>1. Send this code</b><br>${ta}<br><b>2. Paste their reply</b><br><textarea id="mpin2"></textarea><button class="b g" onclick="mpAnswer()">CONNECT</button></div>`:`<button class="b g" onclick="mpHost()">CREATE GAME</button>`):(MP.code?`<div class="p"><b>Send this reply to the host</b><br>${ta}</div>`:`<div class="p"><b>Paste the host's code</b><br><textarea id="mpin"></textarea><button class="b g" onclick="mpJoin()">JOIN</button></div>`)}
 $('#mpb').innerHTML=h};
/* ---------- betting, black market, nametag ---------- */
function bgx(b){if(b[2]=='face'){X.fillStyle='#8fd45a';X.fillRect(45,15,90,95);X.fillRect(40,25,100,75);X.fillStyle='#000';X.fillRect(58,40,20,5);X.fillRect(102,40,20,5);X.fillRect(62,45,12,3);X.fillRect(106,45,12,3);X.fillStyle='#600';X.fillRect(70,85,40,24);X.fillStyle='#f66';X.fillRect(74,102,32,7);for(let i=0;i<6;i++){X.fillStyle=`hsl(${i*60+tick*4},90%,55%)`;X.fillRect(74+i*5+Math.round(Math.sin(tick/6+i)*2),104,5,G-104)}}
 if(b[4]){X.textAlign='center';X.font='11px "Press Start 2P",monospace';b[4].split('|').forEach((t,i)=>{X.fillStyle=`hsl(${(tick*3+i*60)%360},90%,70%)`;X.fillText(t,90,110+i*18)});X.textAlign='left'}}
function tag(c,x,y,z){if(!S.nt||!S.nm)return;c.save();c.font=z+'px "Press Start 2P",monospace';c.textAlign='center';c.lineWidth=z/3;c.strokeStyle='#000';c.strokeText(S.nm,x,y);c.fillStyle='#fff';c.fillText(S.nm,x,y);c.restore()}
UI.menu=()=>{$('#bmside').style.display=S.bm?'block':'none'};UI.menu();
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'),_ul=UI.locker;
UI.locker=()=>{_ul();const e=$('#ntg');e.style.display=S.nt?'block':'none';if(S.nt)e.innerHTML=`NAMETAG <input type="text" id="nti" maxlength="14" value="${esc(S.nm||'')}" onchange="S.nm=this.value.slice(0,14);save()"> <small>shows above your bird</small>`};
function bmRedeem(){const k=$('#bmi').value.trim().toLowerCase().replace(/:/g,''),c=BMC[k],m=$('#bmm');if(!c)return m.textContent='Invalid code.';if(S.codes.includes('bm'+k))return m.textContent='Code already used.';
 S.codes.push('bm'+k);S.p+=c.p||0;S.g+=c.g||0;(c.i||[]).forEach(d=>S.inv[d]=(S.inv[d]||0)+1);save();upd();toast('Secret code accepted!');UI.bm();$('#bmm').textContent=c.msg}
const gotNt=()=>{S.nt=1;S.nm=S.nm||'Player';save();upd();toast('Nametag unlocked! Edit it in the Locker.');UI.bm()};
function buyNt(){ask('Buy the Nametag? Pay with:',()=>{if(S.p<2400000)return toast('Not enough poins!');S.p-=2400000;gotNt()},['2400000 POINS','2400 PEMS'],()=>{if(S.g<2400)return toast('Not enough pems!');S.g-=2400;gotNt()})}
UI.bm=()=>{const mine=I.filter(i=>i.an&&S.inv[i.id]>0);$('#bmb').innerHTML=`<div class="p" style="border-color:${RC[8]}"><small>Ancient exclusives. They can only be unlocked with secret codes typed here.</small></div><div class="p"><b>SECRET CODE</b><br><input type="text" id="bmi" placeholder="Enter secret code"><button class="b g" onclick="bmRedeem()">REDEEM</button><div id="bmm"><small></small></div></div><div class="p"><b>NAMETAG</b><br><small>Shows above your bird. Change the name in the Locker.</small><br>${S.nt?'OWNED':`<button class="b" onclick="buyNt()">2400◆ or 2400000●</button>`}</div><div class="p"><b style="color:${RC[8]}">YOUR ANCIENT ITEMS</b><div class="grid">${mine.map(it=>card(it,'<small>x'+S.inv[it.id]+'</small>','')).join('')||'<small>None yet</small>'}</div></div>`;paint($('#bmb'))};
const GB={tab:'coin',cur:'p',amt:100,pick:null,res:'',busy:0},WS=[['RED','#e33',4,2],['BLUE','#39f',3,3],['GREEN','#3c5',2,4],['GOLD','#fc3',1,9]],CS=[['HEADS','#fc3',1,2],['TAILS','#ccc',1,2]];
UI.bet=()=>{const g=GB,cn=g.tab=='coin',W=cn?CS:WS,tot=W.reduce((a,w)=>a+w[2],0),tb=g.cur=='p'?[10,50,100,500,1000,5000]:[1,5,10,25,50];
 $('#bb').innerHTML=`<div class="tabs"><button class="b ${cn?'g':''}" onclick="if(!GB.busy){GB.tab='coin';GB.pick=null;GB.res='';UI.bet()}">COIN FLIP</button><button class="b ${cn?'':'g'}" onclick="if(!GB.busy){GB.tab='wheel';GB.pick=null;GB.res='';UI.bet()}">COLOR WHEEL</button></div>`+
 `<div class="p"><b>BET WITH</b> <button class="b ${g.cur=='p'?'g':''}" onclick="if(!GB.busy){GB.cur='p';GB.amt=100;UI.bet()}">POINS</button><button class="b ${g.cur=='g'?'g':''}" onclick="if(!GB.busy){GB.cur='g';GB.amt=5;UI.bet()}">PEMS</button><br>${tb.map(n=>`<button class="b ${g.amt==n?'g':''}" onclick="GB.amt=${n};UI.bet()">${n}</button>`).join('')}<br>Custom <input type="text" inputmode="numeric" value="${g.amt}" style="width:35%" onchange="GB.amt=Math.max(1,parseInt(this.value)||1)"></div>`+
 `<div class="p"><b>${cn?'PICK A SIDE':'PICK A COLOR'}</b><br>${W.map(w=>`<button class="b" style="background:${w[1]};${g.pick==w[0]?'outline:.3em solid #fff':''}" onclick="GB.pick='${w[0]}';UI.bet()">${w[0]}<br><small>x${w[3]} | ${Math.round(w[2]/tot*100)}%</small></button>`).join('')}<br><button class="b g" onclick="gPlay()">${cn?'FLIP':'SPIN'}</button></div><div class="p" id="bres" style="text-align:center;font-size:1em">${g.res||'Place your bet!'}</div>`};
function gPlay(){const g=GB,k=g.cur;if(g.busy)return;if(!g.pick)return toast('Pick first!');if(S[k]<g.amt)return toast('Not enough '+(k=='p'?'poins':'pems')+'!');
 S[k]-=g.amt;save();upd();g.busy=1;const W=g.tab=='coin'?CS:WS,tot=W.reduce((a,w)=>a+w[2],0);let r=Math.random()*tot,wi=0;for(;wi<W.length-1;wi++){if((r-=W[wi][2])<0)break}
 let n=0;const stp=()=>{const el=$('#bres');if(scr!='bet'||!el){g.busy=0;return}
  if(n<18){const w=W[n++%W.length];el.innerHTML=`<span style="color:${w[1]};font-size:1.4em">${w[0]}</span>`;sfx('c');return setTimeout(stp,50+n*14)}
  const w=W[wi],win=w[0]==g.pick,pay=win?g.amt*w[3]:0;S[k]+=pay;save();upd();g.busy=0;sfx(win?'s':'h');
  g.res=`<span style="color:${w[1]};font-size:1.4em">${w[0]}!</span><br>${win?`YOU WIN +${pay-g.amt} ${k=='p'?'poins':'pems'}`:`You lost ${g.amt} ${k=='p'?'poins':'pems'}`}`;UI.bet()};stp()}
function rs(){const w=Math.min(innerWidth,innerHeight*.6),e=$('#w');e.style.width=w+'px';e.style.height=w/.6+'px';e.style.fontSize=w/30+'px'}
addEventListener('resize',rs);rs();cv.style.imageRendering=S.set.gfx?'pixelated':'auto';reset(true);upd();$('#cur').style.display='none';requestAnimationFrame(loop);
</script></body></html>
